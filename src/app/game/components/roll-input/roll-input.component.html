<form [formRoot]="rollForm" class="roll-input">
  <label for="pins">Pins knocked down</label>
  <div class="row">
    <input
      #pinsInput
      id="pins"
      type="number"
      inputmode="numeric"
      [formField]="rollForm.pins"
      [class.invalid]="errorMessage()"
    />
    <button type="submit" class="primary" [disabled]="gameOver() || rollForm().invalid()">
      Roll
    </button>
    <button type="button" [disabled]="gameOver()" (click)="rollRandom()">Random</button>
  </div>
  <p class="hint">
    @if (gameOver()) {
      The game is over. Start a new game to keep playing.
    } @else {
      Enter a number from 0 to {{ pinsStanding() }}.
    }
  </p>
  @if (errorMessage(); as message) {
    <p class="error">{{ message }}</p>
  }
</form>
