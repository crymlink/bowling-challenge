<form [formRoot]="rollForm" class="roll-input">
  <label for="pins">Pins knocked down</label>
  <div class="row">
    <input
      #pinsInput
      id="pins"
      type="number"
      inputmode="numeric"
      [formField]="rollForm.pins"
      [attr.aria-invalid]="errorMessage() ? 'true' : null"
      [attr.aria-describedby]="errorMessage() ? 'pins-hint pins-error' : 'pins-hint'"
    />
    <button type="submit" class="primary" [disabled]="gameOver() || rollForm().invalid()">
      Roll
    </button>
    <button type="button" [disabled]="gameOver()" (click)="randomRoll.emit()">Random</button>
  </div>
  <p id="pins-hint" class="hint">
    @if (gameOver()) {
      The game is over. Start a new game to keep playing.
    } @else {
      Enter a number from 0 to {{ maxPins() }}.
    }
  </p>
  @if (errorMessage(); as message) {
    <p id="pins-error" class="error">{{ message }}</p>
  }
</form>
