<section>
  <h2>Score sheet</h2>
  <ol class="frames">
    @for (frame of frames(); track frame.number) {
      <li>
        <app-frame [frame]="frame" [class.current]="frame.number === currentFrame()" />
      </li>
    }
  </ol>
  <p class="total-score">
    Total score: <strong>{{ totalScore() }}</strong>
  </p>
</section>
