<section aria-labelledby="score-sheet-heading">
  <h2 id="score-sheet-heading">Score sheet</h2>
  <ol class="frames">
    @for (frame of frames(); track frame.number) {
      @let isCurrent = frame.number === currentFrame();
      <li [attr.aria-current]="isCurrent ? 'step' : null">
        <app-frame [frame]="frame" [current]="isCurrent" />
      </li>
    }
  </ol>
  <p class="total-score">
    Total score: <strong>{{ totalScore() }}</strong>
  </p>
</section>
