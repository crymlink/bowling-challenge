<div class="game">
  <h1>Bowling score</h1>

  <p class="status">
    @if (store.currentPosition(); as position) {
      <strong>Frame {{ position.frame }} · Roll {{ position.roll }}</strong>
      · {{ store.pinsStanding() }} pins standing
    } @else {
      <strong>Game over</strong> — final score {{ store.totalScore() }}
    }
  </p>

  <app-roll-input
    [position]="store.currentPosition()"
    [pinsStanding]="store.pinsStanding()"
    (roll)="store.roll($event)"
  />

  <div class="controls">
    <button type="button" [class.primary]="store.isGameOver()" (click)="store.reset()">
      New game
    </button>
  </div>

  <app-score-sheet
    [frames]="store.frames()"
    [currentFrame]="store.currentPosition()?.frame ?? null"
    [totalScore]="store.totalScore()"
  />
</div>
