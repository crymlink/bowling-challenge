<div class="game">
  <h1>Bowling score</h1>

  <p class="status">
    <strong>{{ game.positionLabel() }}</strong>
    @if (game.isGameOver()) {
      — final score {{ game.totalScore() }}
    } @else {
      · {{ game.maxPins() }} pins standing
    }
  </p>

  <app-roll-input
    [maxPins]="game.maxPins()"
    [gameOver]="game.isGameOver()"
    (roll)="game.roll($event)"
    (randomRoll)="game.rollRandom()"
  />

  <app-game-controls [gameOver]="game.isGameOver()" (newGame)="newGame()" />

  <app-score-sheet
    [frames]="game.frames()"
    [currentFrame]="game.currentFrame()"
    [totalScore]="game.totalScore()"
  />
</div>
