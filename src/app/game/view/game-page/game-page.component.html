<div class="game">
  <h1>Bowling score</h1>

  <p class="status">
    <strong>{{ game.positionLabel() }}</strong>
    @if (store.isGameOver()) {
      — final score {{ store.totalScore() }}
    } @else {
      · {{ store.pinsStanding() }} pins standing
    }
  </p>

  <app-roll-input
    [position]="store.currentPosition()"
    [pinsStanding]="store.pinsStanding()"
    (roll)="game.roll($event)"
    (randomRoll)="game.rollRandom()"
  />

  <app-game-controls [gameOver]="store.isGameOver()" (newGame)="game.newGame()" />

  <app-score-sheet
    [frames]="store.frames()"
    [currentFrame]="game.currentFrame()"
    [totalScore]="store.totalScore()"
  />
</div>
